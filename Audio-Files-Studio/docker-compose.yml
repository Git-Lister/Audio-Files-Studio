services:
  studio:
    image: audio-files-studio
    build:
      context: .
      dockerfile: Dockerfile.phase3
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - C:\bookforge\models:/models
      - bookforge-llm:/llm-models
      - bookforge-hf-cache:/root/.cache/huggingface
    environment:
      - COQUI_TTS_AGREED=1
      - HF_HUB_DISABLE_SSL_VERIFY=1
      - PYTHONHTTPSVERIFY=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: python src/bookforge/ui/main.py

volumes:
  bookforge-llm:
  bookforge-hf-cache: